name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Run Tests and Publish Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi

      - name: Install testing and coverage tools
        run: |
          python -m pip install pytest pytest-cov coverage

      - name: Run tests and generate coverage
        id: tests
        continue-on-error: true
        run: |
          set +e

          pytest -vv -ra --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            2>&1 | tee test-coverage-output.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "test_exit_code=${TEST_EXIT_CODE}" >> "$GITHUB_OUTPUT"

          {
            echo "## Python Test Coverage"
            echo ""
            echo "**Minimum required coverage:** 80%"
            echo ""
            echo '```text'
            cat test-coverage-output.txt
            echo '```'
            echo ""
            echo "### Coverage Summary"
            echo ""
            echo '```text'
            coverage report -m || true
            echo '```'
          } > coverage-comment.md

          exit 0

      - name: Publish coverage comment on pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('coverage-comment.md', 'utf8');

            const marker = '<!-- python-coverage-report -->';
            const commentBody = `${marker}\n${body}`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody
              });
            }

      - name: Enforce minimum coverage requirement
        run: |
          TEST_EXIT_CODE="${{ steps.tests.outputs.test_exit_code }}"

          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            echo "Tests failed or minimum coverage of 80% was not achieved."
            exit "$TEST_EXIT_CODE"
          fi

          echo "Tests passed and minimum coverage requirement was achieved."